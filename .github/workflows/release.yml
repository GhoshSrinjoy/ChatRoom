name: Release

# Push a version tag (for example v0.7.0) to build, test and package the extension
# and publish a GitHub Release with the .vsix attached. The tag must match package.json.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (for example v0.7.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check that the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match package.json version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Package
        run: npx --no-install vsce package --no-dependencies --allow-missing-repository --out "chatroom-$VERSION.vsix"

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            $0 == "## " v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "See CHANGELOG.md." > release-notes.md; fi
          printf '\n---\nInstall: download `chatroom-%s.vsix`, then in VS Code run **Extensions: Install from VSIX…** and reload the window.\n' "$VERSION" >> release-notes.md

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "chatroom-$VERSION.vsix" --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" "chatroom-$VERSION.vsix" --title "Chatroom $VERSION" --notes-file release-notes.md
          fi
